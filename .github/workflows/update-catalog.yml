name: Update mod catalog

# Regenerates the three generated blocks in profile/README.md from the org's repositories, so the landing
# page never needs a manual edit. Source of truth = each repo's description, topics and releases.
#
#   game-<slug>     -> the "Mods" table, grouped and headed by game. New mod = create the repo with a
#                      description and a game-<slug> topic. New game = just use a new slug.
#   for-modders     -> moves a repo into that game's collapsed "For modders" list: libraries, shared source,
#                      example projects. Things a player never installs on purpose.
#   doodesch-tool   -> the "Tools and sites" list, for what is not a mod at all.
#
# The newest releases across the catalogue fill a third block on their own - the one thing a returning
# visitor actually wants and the one thing a static page cannot keep true.
#
# Optional pretty names and ordering for the game headings live in profile/games.json. A repo with none of
# the topics above is invisible here, which is the usual reason a new repo never shows up, so the run
# warns and names it.

on:
  schedule:
    - cron: "17 6 * * *"        # daily
  workflow_dispatch: {}
  repository_dispatch:
    types: [catalog-update]      # member repos can POST a dispatch to refresh on release

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalog into profile/README.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const org = context.repo.owner;
            const path = 'profile/README.md';
            const TOOL_TOPIC = 'doodesch-tool';
            const MODDER_TOPIC = 'for-modders';
            const RECENT = 6;

            let games = {};
            try { games = JSON.parse(fs.readFileSync('profile/games.json', 'utf8')); } catch (e) {}

            let nexusCfg = {};
            try { nexusCfg = JSON.parse(fs.readFileSync('profile/nexus.json', 'utf8')); } catch (e) {}

            // Download numbers straight from Nexus. The v2 GraphQL endpoint answers this uploader's own mods
            // anonymously, so no secret is involved and a fork of this repo keeps working. A failure here costs
            // the numbers and nothing else: every column falls back to blank and the page still builds.
            const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const nexusByGame = {};
            if (nexusCfg.uploaderId) {
              try {
                const query = `{ mods(filter: { uploaderId: [{ value: "${nexusCfg.uploaderId}", op: EQUALS }] }, count: 100) {
                  nodes { modId name downloads game { domainName } } } }`;
                const res = await fetch('https://api.nexusmods.com/v2/graphql', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query }),
                });
                const body = await res.json();
                if (body.errors) throw new Error(JSON.stringify(body.errors).slice(0, 200));

                for (const m of (body.data?.mods?.nodes || [])) {
                  const domain = m.game?.domainName || '';
                  (nexusByGame[domain] ||= { byName: {}, byId: {} });
                  // The title up to its first " - " is the mod's actual name; the rest is the tagline.
                  nexusByGame[domain].byName[norm(m.name.split(' - ')[0])] = m;
                  nexusByGame[domain].byId[m.modId] = m;
                }
                core.info(`Nexus: ${(body.data?.mods?.nodes || []).length} mod(s) read.`);
              } catch (e) {
                core.warning(`Nexus downloads unavailable, the columns stay empty: ${e.message}`);
              }
            }

            const repos = await github.paginate(github.rest.repos.listForOrg, { org, type: 'public', per_page: 100 });
            const live = repos.filter(r => !r.archived && !r.fork && !r.private);

            const groups = {};
            const tools = [];
            for (const r of live) {
              for (const t of (r.topics || [])) {
                const m = /^game-(.+)$/.exec(t);
                if (m) (groups[m[1]] ||= []).push(r);
                else if (t === TOOL_TOPIC) tools.push(r);
              }
            }

            const untagged = live
              .filter(r => r.name !== '.github')
              .filter(r => !(r.topics || []).some(t => /^game-/.test(t) || t === TOOL_TOPIC))
              .map(r => r.name);
            if (untagged.length) {
              core.warning(`Not on the page - no game-* or ${TOOL_TOPIC} topic: ${untagged.join(', ')}`);
            }

            const titleCase = s => s.split('-')
              .map(w => w === 'i' ? 'I' : (w ? w[0].toUpperCase() + w.slice(1) : w))
              .join(' ');
            const nameOf = s => (games[s] && games[s].name) || titleCase(s);
            const orderOf = s => (games[s] && typeof games[s].order === 'number') ? games[s].order : 999;
            const byName = (a, b) => a.name.localeCompare(b.name);

            // A table is only easier to scan than bullets if the second column stays one line wide, so the
            // description is cut to a sentence where there is one and to a word boundary otherwise. The full
            // text is one click away on the repo itself, which is where somebody who wants it is going next.
            const LIMIT = 96;
            const summarise = r => {
              let d = (r.description || '').replace(/\s+/g, ' ').replace(/\|/g, '\\|').trim();
              if (d.length <= LIMIT) return d;

              const stop = d.slice(0, LIMIT + 1).lastIndexOf('. ');
              if (stop > LIMIT * 0.5) return d.slice(0, stop + 1);

              return d.slice(0, d.lastIndexOf(' ', LIMIT - 3)).replace(/[,;:-]$/, '') + '...';
            };

            // Which Nexus page a repo is. Three spellings are tried against the Nexus title, all inside the
            // repo's own game: the repo name, the name without a shared game prefix, and whatever follows the
            // last dash. An override in nexus.json wins over all of them, and no match means no number - a
            // wrong count next to a mod is worse than an empty cell.
            const missingOnNexus = [];
            const nexusFor = (r, slug, strip) => {
              const domain = games[slug] && games[slug].nexus;
              const shelf = domain && nexusByGame[domain];
              if (!shelf) return null;

              const override = (nexusCfg.overrides || {})[r.name];
              if (override) return shelf.byId[override] || null;

              const cut = r.name.indexOf('-');
              const candidates = [r.name];
              if (cut > 0 && strip && strip.has(r.name.slice(0, cut))) candidates.push(r.name.slice(cut + 1));
              if (r.name.includes('-')) candidates.push(r.name.slice(r.name.lastIndexOf('-') + 1));

              for (const c of candidates) {
                const hit = shelf.byName[norm(c)];
                if (hit) return hit;
              }

              missingOnNexus.push(r.name);
              return null;
            };

            const count = n => n.toLocaleString('en-US');

            const table = (list, strip, slug) => {
              // Sorted by the LABEL, not by the repo name. With the shared prefix dropped the two differ, and
              // sorting by the hidden name puts RVRepairVan above Clipwise for a reason nobody can see.
              const rows = list
                .map(r => {
                  const cut = r.name.indexOf('-');
                  const label = (strip && cut > 0 && strip.has(r.name.slice(0, cut))) ? r.name.slice(cut + 1) : r.name;
                  return { label, r, nexus: slug ? nexusFor(r, slug, strip) : null };
                })
                .sort((a, b) => a.label.localeCompare(b.label));

              const withNumbers = rows.some(x => x.nexus);

              let md = withNumbers
                ? '| Mod | What it does | Downloads |\n|---|---|--:|\n'
                : '| Mod | What it does |\n|---|---|\n';

              for (const { label, r, nexus } of rows) {
                md += `| **[${label}](${r.html_url})** | ${summarise(r)} |`;
                if (withNumbers) {
                  md += nexus
                    ? ` [${count(nexus.downloads)}](https://www.nexusmods.com/${nexus.game.domainName}/mods/${nexus.modId}) |`
                    : ' |';
                }
                md += '\n';
              }
              return md;
            };

            // Inside a section headed "Schedule I", twenty rows starting with "ScheduleOne-" spend the widest
            // column on the one word every row shares. The prefix is dropped when at least two repos in the
            // group carry it, which leaves a one-off like RVRepairVan alone - and the short form is what the
            // mod is called on Nexus and Thunderstore anyway. The link still points at the real repo.
            const sharedPrefixes = list => {
              const seen = {};
              for (const r of list) {
                const cut = r.name.indexOf('-');
                if (cut > 0) seen[r.name.slice(0, cut)] = (seen[r.name.slice(0, cut)] || 0) + 1;
              }
              return new Set(Object.keys(seen).filter(p => seen[p] > 1));
            };

            let modsMd = '';
            const slugs = Object.keys(groups)
              .sort((a, b) => (orderOf(a) - orderOf(b)) || nameOf(a).localeCompare(nameOf(b)));

            for (const slug of slugs) {
              const all = groups[slug];
              const strip = sharedPrefixes(all);
              const forModders = all.filter(r => (r.topics || []).includes(MODDER_TOPIC));
              const forPlayers = all.filter(r => !(r.topics || []).includes(MODDER_TOPIC));

              modsMd += `### ${nameOf(slug)}\n\n`;
              modsMd += table(forPlayers.length ? forPlayers : all, strip, slug);

              // Libraries, shared source and example projects are noise to the person looking for something
              // to install, and the only thing that matters to the person writing a mod. Folded, not dropped.
              if (forPlayers.length && forModders.length) {
                modsMd += `\n<details>\n<summary><b>For modders</b> - libraries, shared source and examples (${forModders.length})</summary>\n\n`;
                modsMd += table(forModders, strip, slug);
                modsMd += `\n</details>\n`;
              }
              modsMd += '\n';
            }

            let toolsMd = '| Project | What it is |\n|---|---|\n';
            for (const r of tools.sort(byName)) toolsMd += `| **[${r.name}](${r.html_url})** | ${summarise(r)} |\n`;
            if (!tools.length) toolsMd = '';

            // Newest releases, across everything in the catalogue. A repo with no release 404s and is skipped.
            // Labels are shortened the same way the tables shorten them, against every catalogued repo rather
            // than one game's, so a mod reads the same here as it does below and as it does on Nexus. The game
            // earns its own column: this is the one list on the page that is not already grouped by one.
            const catalogued = [...new Set(Object.values(groups).flat())];
            const strippedGlobally = sharedPrefixes(catalogued);
            const gameOf = {};
            for (const slug of slugs) for (const r of groups[slug]) gameOf[r.name] ||= nameOf(slug);

            const shorten = name => {
              const cut = name.indexOf('-');
              return (cut > 0 && strippedGlobally.has(name.slice(0, cut))) ? name.slice(cut + 1) : name;
            };

            const releases = [];
            for (const r of catalogued) {
              try {
                const { data } = await github.rest.repos.getLatestRelease({ owner: org, repo: r.name });
                if (data.draft || data.prerelease || !data.published_at) continue;
                releases.push({ repo: r.name, url: data.html_url, tag: data.tag_name, at: data.published_at });
              } catch (e) {
                if (e.status !== 404) core.warning(`Could not read the latest release of ${r.name}: ${e.message}`);
              }
            }
            releases.sort((a, b) => b.at.localeCompare(a.at));

            const day = iso => new Date(iso).toISOString().slice(0, 10);
            let releasesMd = '';
            for (const rel of releases.slice(0, RECENT)) {
              releasesMd += `| ${day(rel.at)} | ${gameOf[rel.repo] || ''} | **[${shorten(rel.repo)}](https://github.com/${org}/${rel.repo})** | [${rel.tag}](${rel.url}) |\n`;
            }
            if (releasesMd) releasesMd = '| Date | Game | Mod | Version |\n|---|---|---|---|\n' + releasesMd;

            // The icon strip. Twenty-five mods already ship a 256px icon at thunderstore/icon.png, which is real
            // artwork rather than a generated gradient with the org name in it - so the page's one visual is the
            // work itself. Existence is checked per run: a missing file would render as a broken image, which is
            // worse than no picture at all. Height only, so the browser keeps each icon square.
            const iconUrl = r => `https://raw.githubusercontent.com/${org}/${r.name}/${r.default_branch || 'main'}/thunderstore/icon.png`;
            const hasIcon = async r => {
              try {
                const res = await fetch(iconUrl(r), { method: 'HEAD' });
                return res.ok;
              } catch (e) { return false; }
            };

            let iconsMd = '';
            const iconRepos = [];
            for (const slug of slugs) {
              const strip = sharedPrefixes(groups[slug]);
              for (const r of groups[slug]) {
                if ((r.topics || []).includes(MODDER_TOPIC)) continue;   // libraries and samples have nothing to show
                const cut = r.name.indexOf('-');
                const label = (cut > 0 && strip.has(r.name.slice(0, cut))) ? r.name.slice(cut + 1) : r.name;
                iconRepos.push({ label, r });
              }
            }
            iconRepos.sort((a, b) => a.label.localeCompare(b.label));

            const withIcons = [];
            for (const item of iconRepos) if (await hasIcon(item.r)) withIcons.push(item);
            for (const { label, r } of withIcons) {
              iconsMd += `<a href="${r.html_url}" title="${label}"><img src="${iconUrl(r)}" alt="${label}" height="64"></a>\n`;
            }
            core.info(`Icons: ${withIcons.length} of ${iconRepos.length} mod(s) have one.`);

            if (missingOnNexus.length) {
              core.warning(`No Nexus page matched, so no download count: ${[...new Set(missingOnNexus)].join(', ')}`);
            }

            const everyMod = Object.values(nexusByGame).flatMap(g => Object.values(g.byId));
            const total = everyMod.reduce((sum, m) => sum + (m.downloads || 0), 0);
            const totalMd = total
              ? `[![Nexus](https://img.shields.io/badge/Nexus-${encodeURIComponent(count(total))}%20downloads-da8e35)](${nexusCfg.profileUrl || '#'})`
              : '';

            // Each block is replaced on its own, so an empty one leaves what is there rather than wiping a
            // section because a listing call came back short.
            const write = (readme, marker, body) => {
              const START = `<!-- ${marker}:START -->`;
              const END = `<!-- ${marker}:END -->`;
              const re = new RegExp(`${START}[\\s\\S]*?${END}`);

              if (!re.test(readme)) { core.setFailed(`Markers ${marker}:START / ${marker}:END not found in ${path}`); return null; }
              if (!body.trim()) { core.warning(`Nothing to put in ${marker} - leaving it unchanged.`); return readme; }

              const block = `${START}\n<!-- Auto-generated from the org's repo topics and releases. Do not edit by hand. -->\n\n${body.trim()}\n${END}`;
              return readme.replace(re, block);
            };

            let readme = fs.readFileSync(path, 'utf8');
            const before = readme;

            for (const [marker, body] of [['MODS', modsMd], ['TOOLS', toolsMd], ['RELEASES', releasesMd], ['TOTAL', totalMd], ['ICONS', iconsMd]]) {
              readme = write(readme, marker, body);
              if (readme === null) return;
            }

            if (readme !== before) {
              fs.writeFileSync(path, readme);
              core.info(`Catalog updated: ${slugs.length} game(s), ${tools.length} tool(s), ${releases.length} release(s), ${count(total)} download(s), ${withIcons.length} icon(s).`);
            } else {
              core.info('Catalog already up to date.');
            }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "chore: auto-update mod catalog"
          git push
